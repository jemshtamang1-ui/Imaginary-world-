<!doctype html><html><body style="margin:0;background:#000">
<canvas id="c" width="512" height="512"></canvas>
<script>
// Raymarches one cumulus cloud into a 512x512 card.
// Output: R = sun-lit brightness (self-shadowed), G = sky ambient (height + outer shell), B = 0, A = opacity.
const VS = `attribute vec2 p; varying vec2 uv; void main(){ uv = p*.5+.5; gl_Position = vec4(p,0.,1.); }`;
const FS = `precision highp float;
varying vec2 uv;
uniform vec4 S[28]; uniform int N; uniform float seed; uniform vec3 L;
float h(vec3 p){ p = fract(p*0.3183099+.1); p *= 17.0; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
float n3(vec3 x){ vec3 i=floor(x), f=fract(x); f=f*f*(3.-2.*f);
  return mix(mix(mix(h(i),h(i+vec3(1,0,0)),f.x),mix(h(i+vec3(0,1,0)),h(i+vec3(1,1,0)),f.x),f.y),
             mix(mix(h(i+vec3(0,0,1)),h(i+vec3(1,0,1)),f.x),mix(h(i+vec3(0,1,1)),h(i+vec3(1,1,1)),f.x),f.y),f.z); }
float fbm(vec3 p){ float a=.5, s=0.; for(int i=0;i<5;i++){ s+=a*n3(p); p=p*2.03+vec3(1.7,9.2,3.1); a*=.5; } return s; }
float shape(vec3 p){
  float d = -1.0;
  for(int i=0;i<28;i++){ if(i>=N) break; vec4 s=S[i]; float k = 1.0 - length(p-s.xyz)/s.w; d = max(d, k); }
  return d;
}
float dens(vec3 p){
  float d = shape(p);
  if(d < -0.35) return 0.;
  vec3 q = p*3.0 + seed;
  float b = fbm(q);
  d += (b - .5) * .8 - abs(n3(p*9.+seed) - .5) * .22 - abs(n3(p*19.+seed*1.3)-.5)*.08;
  d *= smoothstep(-0.66, -0.48, p.y);           // flat base
  return clamp(d*6.0, 0., 1.);
}
void main(){
  vec2 xy = uv*2.-1.;
  float T = 1.0, lit = 0.0, amb = 0.0;
  const int STEPS = 64;
  float dz = 2.0/float(STEPS);
  for(int i=0;i<STEPS;i++){
    vec3 p = vec3(xy, 1.0 - float(i)*dz);
    float d = dens(p);
    if(d > 0.01){
      float a = 1.0 - exp(-d*dz*14.0);
      float sh = 0.0;
      for(int j=1;j<=6;j++){ sh += dens(p + L*float(j)*0.07); }
      float l = exp(-sh*2.2);
      float powder = 1.0 - exp(-d*4.0);
      lit += T*a*l*mix(.6,1.,powder);
      amb += T*a*(0.45 + 0.55*clamp(p.y*.5+.5,0.,1.));
      T *= 1.0 - a;
      if(T < 0.01) break;
    }
  }
  float A = 1.0 - T;
  gl_FragColor = vec4(A>0.001 ? lit/A : 0., A>0.001 ? amb/A : 0., 0., A);
}`;
const c = document.getElementById('c');
const gl = c.getContext('webgl', { preserveDrawingBuffer: true, premultipliedAlpha: false, alpha: true });
function sh(type, src){ const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(s); return s; }
const pr = gl.createProgram(); gl.attachShader(pr, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, FS)); gl.linkProgram(pr); gl.useProgram(pr);
const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(pr, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

function rng(seed){ let a = seed>>>0; return () => { a|=0; a=(a+0x6D2B79F5)|0; let t=Math.imul(a^(a>>>15),1|a); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }; }
// kind 0: wide flat cumulus, 1: medium heap, 2: towering
function spheres(i){
  const r = rng(1000 + i*77), kind = i % 3, S = [];
  const base = kind === 0 ? 7 : 5, w = kind === 0 ? .78 : kind === 1 ? .6 : .45;
  for(let k=0;k<base;k++){ const x = -w + 2*w*(k+.5)/base + (r()-.5)*.12; S.push([x, -.42 + r()*.08, (r()-.5)*.3, .2 + r()*.12]); }
  const tiers = kind === 0 ? 2 : kind === 1 ? 4 : 6;
  let cx = (r()-.5)*.2;
  for(let k=0;k<tiers;k++){
    const y = -.28 + (k+1) * (kind === 2 ? .155 : .13);
    const rad = (kind === 2 ? .3 : .26) * (1 - k/(tiers+2)) + r()*.05;
    const cnt = 1 + (r() < .7 ? 1 : 0) + (k < 2 ? 1 : 0);
    for(let m=0;m<cnt;m++){ let rr = rad*(.8+r()*.3), yy = y + (r()-.5)*.06; rr = Math.max(.15, Math.min(rr, .8 - yy)); S.push([cx + (r()-.5)*.36, yy, (r()-.5)*.25, rr]); }
    cx += (r()-.5)*.12;
  }
  return S.slice(0, 28);
}
window.bake = (i) => {
  const S = spheres(i), flat = new Float32Array(28*4);
  S.forEach((s, k) => flat.set(s, k*4));
  gl.uniform4fv(gl.getUniformLocation(pr, 'S'), flat);
  gl.uniform1i(gl.getUniformLocation(pr, 'N'), S.length);
  gl.uniform1f(gl.getUniformLocation(pr, 'seed'), i*13.7);
  const L = [.55, .75, .35], n = Math.hypot(...L);
  gl.uniform3f(gl.getUniformLocation(pr, 'L'), L[0]/n, L[1]/n, L[2]/n);
  gl.viewport(0,0,512,512); gl.clearColor(0,0,0,0); gl.clear(gl.COLOR_BUFFER_BIT);
  gl.drawArrays(gl.TRIANGLES, 0, 3); gl.finish();
  return c.toDataURL('image/png');
};
window.ready = true;
</script></body></html>
